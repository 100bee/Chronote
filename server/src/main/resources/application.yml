spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chronote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/chronote}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080

pyserver:
  url: ${PYSERVER_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:chronote-secret-key-please-change-this-in-production-256bit}
  expiration: ${JWT_EXPIRATION:86400000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4.1-mini}