spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chronote?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
server:
  port: 8080

jwt:
  secret: chronote-secret-key-please-change-this-in-production-256bit
  expiration: 86400000
